services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: amazon_geo_rank
      POSTGRES_USER: amazon_geo_rank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amazon_geo_rank -d amazon_geo_rank"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://amazon_geo_rank:${POSTGRES_PASSWORD:-change-me}@postgres:5432/amazon_geo_rank
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://amazon_geo_rank:${POSTGRES_PASSWORD:-change-me}@postgres:5432/amazon_geo_rank
      AUTO_CREATE_SCHEMA: "false"
      API_KEY_PEPPER: ${API_KEY_PEPPER:-change-me}
      API_HOST: 0.0.0.0
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_ISSUER: ${MFA_ISSUER:-Amazon Geo Rank Monitor}
      MFA_CHALLENGE_MINUTES: ${MFA_CHALLENGE_MINUTES:-5}
      TRUSTED_DEVICE_DAYS: ${TRUSTED_DEVICE_DAYS:-30}
      TRUSTED_DEVICE_COOKIE_NAME: ${TRUSTED_DEVICE_COOKIE_NAME:-agrm_trusted_device}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-agrm_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-agrm_csrf}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      OXYLABS_USERNAME: ${OXYLABS_USERNAME:-}
      OXYLABS_PASSWORD: ${OXYLABS_PASSWORD:-}
      RESIDENTIAL_PROXY_USERNAME: ${RESIDENTIAL_PROXY_USERNAME:-}
      RESIDENTIAL_PROXY_PASSWORD: ${RESIDENTIAL_PROXY_PASSWORD:-}
      RESIDENTIAL_PROXY_SERVER: ${RESIDENTIAL_PROXY_SERVER:-http://pr.oxylabs.io:7777}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["agrm-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://amazon_geo_rank:${POSTGRES_PASSWORD:-change-me}@postgres:5432/amazon_geo_rank
      AUTO_CREATE_SCHEMA: "false"
      API_KEY_PEPPER: ${API_KEY_PEPPER:-change-me}
      WORKER_ID: ${WORKER_ID:-rank-worker-1}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-900}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-30}
      JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-900}
      OXYLABS_USERNAME: ${OXYLABS_USERNAME:-}
      OXYLABS_PASSWORD: ${OXYLABS_PASSWORD:-}
      RESIDENTIAL_PROXY_USERNAME: ${RESIDENTIAL_PROXY_USERNAME:-}
      RESIDENTIAL_PROXY_PASSWORD: ${RESIDENTIAL_PROXY_PASSWORD:-}
      RESIDENTIAL_PROXY_SERVER: ${RESIDENTIAL_PROXY_SERVER:-http://pr.oxylabs.io:7777}
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["agrm-scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://amazon_geo_rank:${POSTGRES_PASSWORD:-change-me}@postgres:5432/amazon_geo_rank
      AUTO_CREATE_SCHEMA: "false"
      API_KEY_PEPPER: ${API_KEY_PEPPER:-change-me}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-30}
      SCHEDULER_ID: ${SCHEDULER_ID:-scheduler-1}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
