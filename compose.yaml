services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: amazon_geo_rank
      POSTGRES_USER: amazon_geo_rank
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://amazon_geo_rank:change-me@postgres:5432/amazon_geo_rank
      API_KEY_PEPPER: change-me
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres-data:
