x-backend: &backend
  image: agrm-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &environment
    DATABASE_URL: postgresql+psycopg://amazon_geo_rank:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/amazon_geo_rank
    AUTO_CREATE_SCHEMA: 'false'
    API_KEY_PEPPER: ${API_KEY_PEPPER:?Set API_KEY_PEPPER}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    API_HOST: 0.0.0.0
    API_PORT: '8000'
    FORWARDED_ALLOW_IPS: ${AGRM_FRONTEND_IP:-172.30.91.10}
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: amazon_geo_rank
      POSTGRES_USER: amazon_geo_rank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amazon_geo_rank -d amazon_geo_rank']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *backend
    restart: 'no'
    command: ['alembic', '-c', 'alembic.ini', 'upgrade', 'head']
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 6
  worker:
    <<: *backend
    command: ['agrm-worker']
    environment:
      <<: *environment
      WORKER_ID: ${WORKER_ID:-rank-worker-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-m', 'amazon_geo_rank_monitor.operations.health', 'rank']
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
  scheduler:
    <<: *backend
    command: ['agrm-scheduler']
    environment:
      <<: *environment
      SCHEDULER_ID: ${SCHEDULER_ID:-scheduler-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-m', 'amazon_geo_rank_monitor.operations.health', 'scheduler']
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
  frontend:
    environment:
      TRUSTED_EDGE_PROXY_CIDR: ${TRUSTED_EDGE_PROXY_CIDR:-${AGRM_NETWORK_GATEWAY:-172.30.91.1}}
    networks:
      default:
        ipv4_address: ${AGRM_FRONTEND_IP:-172.30.91.10}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_AGRM_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-agrm_csrf}
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres-data:
networks:
  default:
    ipam:
      config:
        - subnet: ${AGRM_NETWORK_SUBNET:-172.30.91.0/24}
          gateway: ${AGRM_NETWORK_GATEWAY:-172.30.91.1}
