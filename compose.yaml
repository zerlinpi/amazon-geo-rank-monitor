services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: amazon_geo_rank
      POSTGRES_USER: amazon_geo_rank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://amazon_geo_rank:${POSTGRES_PASSWORD:-change-me}@postgres:5432/amazon_geo_rank
      API_KEY_PEPPER: ${API_KEY_PEPPER:-change-me}
      API_HOST: 0.0.0.0
      OXYLABS_USERNAME: ${OXYLABS_USERNAME:-}
      OXYLABS_PASSWORD: ${OXYLABS_PASSWORD:-}
      RESIDENTIAL_PROXY_USERNAME: ${RESIDENTIAL_PROXY_USERNAME:-}
      RESIDENTIAL_PROXY_PASSWORD: ${RESIDENTIAL_PROXY_PASSWORD:-}
      RESIDENTIAL_PROXY_SERVER: ${RESIDENTIAL_PROXY_SERVER:-http://pr.oxylabs.io:7777}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["agrm-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://amazon_geo_rank:${POSTGRES_PASSWORD:-change-me}@postgres:5432/amazon_geo_rank
      API_KEY_PEPPER: ${API_KEY_PEPPER:-change-me}
      OXYLABS_USERNAME: ${OXYLABS_USERNAME:-}
      OXYLABS_PASSWORD: ${OXYLABS_PASSWORD:-}
      RESIDENTIAL_PROXY_USERNAME: ${RESIDENTIAL_PROXY_USERNAME:-}
      RESIDENTIAL_PROXY_PASSWORD: ${RESIDENTIAL_PROXY_PASSWORD:-}
      RESIDENTIAL_PROXY_SERVER: ${RESIDENTIAL_PROXY_SERVER:-http://pr.oxylabs.io:7777}
    depends_on:
      - postgres

volumes:
  postgres-data:
