name: Walking Pad VOC 100K Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/walking-pad-voc-100k-temp.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/walking-pad-voc-10k
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Collect 100K+ VOC
        env:
          TARGET_REVIEWS: "105000"
          MIN_VALID: "100000"
          OUTDIR: "voc_output"
        run: python scripts/walking_pad_voc_10k.py
      - name: Stats
        if: always()
        run: |
          find voc_output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          cat voc_output/stats.json || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walking-pad-voc-100k
          path: voc_output/
          if-no-files-found: warn
          retention-days: 7
