name: Walking Pad VOC 100K Temp Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/walking-pad-voc-100k-temp.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout temporary collector branch
        uses: actions/checkout@v4
        with:
          ref: tmp/walking-pad-voc-10k
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Collect general treadmill benchmark
        env:
          TARGET_REVIEWS: "100000"
          OUTDIR: "general_treadmill_output"
        run: python scripts/general_treadmill_benchmark.py
      - name: Show stats
        if: always()
        run: |
          find general_treadmill_output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          cat general_treadmill_output/stats.json || true
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walking-pad-voc-general-treadmill-2023
          path: general_treadmill_output/
          if-no-files-found: warn
          retention-days: 7
