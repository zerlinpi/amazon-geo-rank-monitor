name: Walking Pad VOC 100K Temp Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/walking-pad-voc-100k-temp.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout temporary collector branch
        uses: actions/checkout@v4
        with:
          ref: tmp/walking-pad-voc-10k
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests
      - name: Collect adjacent compact treadmill supplement
        env:
          TARGET_REVIEWS: "40000"
          OUTDIR: "adjacent_output"
        run: python scripts/walking_pad_voc_adjacent.py
      - name: Show stats
        if: always()
        run: |
          find adjacent_output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          cat adjacent_output/stats.json || true
      - name: Upload supplement artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walking-pad-voc-adjacent-2023
          path: adjacent_output/
          if-no-files-found: warn
          retention-days: 7
