name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: PostgreSQL integration
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/agrm_test
        run: python -m pytest -q tests/test_postgres_integration.py

      - name: Lint
        run: ruff check src tests
