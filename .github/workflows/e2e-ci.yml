name: Browser E2E
on:
  workflow_call:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.lock && pip install --no-deps -e backend
      - run: npm --prefix frontend ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Production bundle, real API and worker, three timezones
        run: npm --prefix frontend run test:e2e
        env:
          E2E_PYTHON: python
          E2E_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots
          path: frontend/test-results/**/*.png
          retention-days: 3
