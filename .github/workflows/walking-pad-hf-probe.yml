name: Walking Pad HF Recent Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/walking-pad-hf-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/walking-pad-voc-200k-2024-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install huggingface_hub requests datasets pyarrow
      - run: python scripts/search_hf_recent_review_datasets.py

