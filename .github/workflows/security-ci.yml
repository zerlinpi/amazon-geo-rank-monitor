name: Security
on:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Audit locked Python dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements-dev.lock --no-deps --disable-pip
      - name: Audit frontend wrapper and patched upstream
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit --audit-level=high
          npm --prefix frontend run sync
          cd frontend/.vendor/fantastic-admin
          corepack pnpm install --frozen-lockfile
          corepack pnpm audit --fix=override --ignore-unfixable
          git diff -- pnpm-lock.yaml pnpm-workspace.yaml
          git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml
      - name: Install verified Gitleaks binary
        env:
          VERSION: 8.30.1
        run: |
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o /tmp/checksums.txt
          python - <<'PY'
          import hashlib, os, pathlib
          name = f"gitleaks_{os.environ['VERSION']}_linux_x64.tar.gz"
          checksums = dict(line.split()[::-1] for line in pathlib.Path('/tmp/checksums.txt').read_text().splitlines() if line.strip())
          assert hashlib.sha256(pathlib.Path('/tmp/gitleaks.tar.gz').read_bytes()).hexdigest() == checksums[name]
          PY
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan all fetched history and tracked working tree, redacted
        run: |
          /tmp/gitleaks git --log-opts=--all --redact=100 --no-banner
          mkdir /tmp/agrm-source-scan
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C /tmp/agrm-source-scan
          /tmp/gitleaks dir /tmp/agrm-source-scan --redact=100 --no-banner
