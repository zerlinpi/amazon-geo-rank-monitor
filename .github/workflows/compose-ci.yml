name: Compose smoke
on:
  workflow_call:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-local-database-only
      API_KEY_PEPPER: ci-local-pepper-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        run: docker compose config --quiet
      - name: Set isolated test authentication limit
        run: echo 'AUTH_RATE_LIMIT_PER_MINUTE=2' > .env
      - name: Build production images
        run: docker compose build
      - name: Start and wait for migrations and healthy services
        run: docker compose up -d --wait --wait-timeout 180
      - name: Check readiness, frontend and scheduler/worker heartbeats
        run: |
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/ready
          curl --fail http://127.0.0.1:8080/ --output /dev/null
          python - <<'PY'
          import json, urllib.error, urllib.request
          try:
              urllib.request.urlopen('http://127.0.0.1:8080/scim/v2/Users')
              raise AssertionError('Unauthenticated SCIM must not succeed')
          except urllib.error.HTTPError as exc:
              assert exc.code == 401
              assert 'urn:ietf:params:scim:api:messages:2.0:Error' in json.load(exc)['schemas']
          PY
          docker compose exec -T redis redis-cli ping
          docker compose exec -T worker python -m amazon_geo_rank_monitor.operations.health rank
          docker compose exec -T scheduler python -m amazon_geo_rank_monitor.operations.health scheduler
          docker compose exec -T api alembic current
      - name: Check trusted ingress, reject forged client IPs and protect callback logs
        run: |
          python backend/tests/compose_ingress_smoke.py
          docker compose exec -T api python - --base-url http://frontend:8080 --untrusted < backend/tests/compose_ingress_smoke.py
          docker compose exec -T worker python - --base-url http://api:8000 --untrusted < backend/tests/compose_ingress_smoke.py
          docker compose logs --no-color api frontend > /tmp/ingress.log
          python - <<'PY'
          from pathlib import Path
          logs = Path('/tmp/ingress.log').read_text()
          assert 'path=/api/v1/auth/sso/callback' in logs, 'Safe request logging must remain enabled'
          assert 'ci-private-callback-code' not in logs
          assert 'ci-private-callback-state' not in logs
          PY
      - name: Verify proxy failures do not log authentication query values
        run: |
          docker compose stop api
          python - <<'PY'
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen(
                  'http://127.0.0.1:8080/api/v1/auth/sso/callback'
                  '?code=ci-private-outage-code&state=ci-private-outage-state', timeout=10,
              )
              raise AssertionError('Stopped API must fail at the proxy')
          except urllib.error.HTTPError as exc:
              assert exc.code in (502, 504), exc.code
          PY
          docker compose logs --no-color api frontend > /tmp/ingress-outage.log
          python - <<'PY'
          from pathlib import Path
          logs = Path('/tmp/ingress-outage.log').read_text()
          assert 'ci-private-outage-code' not in logs
          assert 'ci-private-outage-state' not in logs
          PY
      - name: Status and logs
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=60
      - name: Remove isolated CI containers and test data
        if: always()
        run: docker compose down --volumes --remove-orphans
