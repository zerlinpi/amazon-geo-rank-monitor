name: Walking Pad Recent Reddit Bulk 200K

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/walking-pad-trustpilot-probe.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/walking-pad-voc-200k-2024-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect recent Reddit bulk composite
        env:
          TARGET_REVIEWS: "200000"
          OUTDIR: "arctic_bulk_output"
        run: python scripts/collect_arctic_bulk_benchmark.py
      - name: Show stats
        if: always()
        run: |
          cat arctic_bulk_output/stats.json || true
          wc -l arctic_bulk_output/reddit_recent_composite_200k.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walking-pad-recent-reddit-bulk
          path: arctic_bulk_output/
          retention-days: 7
