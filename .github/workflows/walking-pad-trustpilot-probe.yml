name: Walking Pad Recent VOC Parse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/walking-pad-trustpilot-probe.yml'

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/walking-pad-voc-200k-2024-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-dateutil
      - run: python scripts/parse_recent_trustpilot.py
      - name: Show stats
        run: cat recent_voc_output/stats.json
      - uses: actions/upload-artifact@v4
        with:
          name: walking-pad-recent-trustpilot
          path: recent_voc_output/
          retention-days: 7
