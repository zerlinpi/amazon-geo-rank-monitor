name: Staging Readiness

on:
  workflow_dispatch:
    inputs:
      paid_provider_probes:
        description: Run one managed and one strict paid provider probe
        required: true
        default: false
        type: boolean
      keyword:
        description: Keyword for explicit paid provider probes
        required: true
        default: walking pad
        type: string
      postal_code:
        description: US ZIP for explicit paid provider probes
        required: true
        default: "10001"
        type: string

permissions:
  contents: read

jobs:
  staging-readiness:
    name: staging-readiness
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      SESSION_COOKIE_SECURE: "true"
      PUBLIC_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      SSO_CALLBACK_URL: ${{ vars.STAGING_API_URL }}/api/v1/auth/sso/callback
      STRIPE_SUCCESS_URL: ${{ vars.STAGING_WEB_URL }}/billing/success
      STRIPE_CANCEL_URL: ${{ vars.STAGING_WEB_URL }}/billing
      CORS_ORIGINS: ${{ vars.STAGING_WEB_URL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
      SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS || 'true' }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
      OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
      RESIDENTIAL_PROXY_USERNAME: ${{ secrets.RESIDENTIAL_PROXY_USERNAME }}
      RESIDENTIAL_PROXY_PASSWORD: ${{ secrets.RESIDENTIAL_PROXY_PASSWORD }}
      RESIDENTIAL_PROXY_SERVER: ${{ vars.RESIDENTIAL_PROXY_SERVER || 'http://pr.oxylabs.io:7777' }}
      READINESS_PAID_PROVIDER_PROBES: ${{ inputs.paid_provider_probes }}
      READINESS_KEYWORD: ${{ inputs.keyword }}
      READINESS_POSTAL_CODE: ${{ inputs.postal_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'

      - name: Validate staging URLs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_API_URL"
          test -n "$STAGING_WEB_URL"
          case "$STAGING_API_URL" in https://*) ;; *) echo "STAGING_API_URL must use HTTPS"; exit 1 ;; esac
          case "$STAGING_WEB_URL" in https://*) ;; *) echo "STAGING_WEB_URL must use HTTPS"; exit 1 ;; esac

      - name: Probe deployed HTTPS surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 "$STAGING_API_URL/health"
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 "$STAGING_API_URL/ready"
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 "$STAGING_WEB_URL/" >/dev/null

      - name: Install Chromium for explicit paid strict probe
        if: ${{ inputs.paid_provider_probes }}
        working-directory: backend
        run: playwright install --with-deps chromium

      - name: Run staging integration readiness
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          args=(--live --keyword "$READINESS_KEYWORD" --postal-code "$READINESS_POSTAL_CODE")
          if [ "$READINESS_PAID_PROVIDER_PROBES" = "true" ]; then
            args+=(--paid-provider-probes)
          fi
          set +e
          agrm-readiness "${args[@]}" | tee staging-readiness.json
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-readiness-${{ github.run_id }}
          path: backend/staging-readiness.json
          if-no-files-found: warn
          retention-days: 30
