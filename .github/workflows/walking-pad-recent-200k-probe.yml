name: Walking Pad Recent VOC 200K Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/walking-pad-recent-200k-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/walking-pad-voc-200k-2024-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/probe_recent_walkingpad_sources.py
