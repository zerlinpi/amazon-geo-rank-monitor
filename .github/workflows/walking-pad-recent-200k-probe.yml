name: Walking Pad Recent VOC 200K Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/walking-pad-recent-200k-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/walking-pad-voc-200k-2024-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Check configured data providers
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          RESIDENTIAL_PROXY_USERNAME: ${{ secrets.RESIDENTIAL_PROXY_USERNAME }}
          RESIDENTIAL_PROXY_PASSWORD: ${{ secrets.RESIDENTIAL_PROXY_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          for k in ["OXYLABS_USERNAME","OXYLABS_PASSWORD","RESIDENTIAL_PROXY_USERNAME","RESIDENTIAL_PROXY_PASSWORD"]:
              print(k, "configured" if bool(os.getenv(k)) else "missing")
          PY
      - run: python scripts/probe_recent_walkingpad_sources.py

